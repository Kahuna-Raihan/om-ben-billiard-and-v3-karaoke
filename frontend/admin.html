<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Om Ben Billiard</title>
    <link rel="stylesheet" href="assets/style.css">
    <style>
        @media (max-width: 768px) {
            .admin-header-flex {
                flex-direction: column;
                align-items: stretch !important;
                gap: 1rem;
            }
            .admin-header-flex .btn {
                width: 100% !important;
            }
            .admin-table-container th:nth-child(1), 
            .admin-table-container td:nth-child(1) { display: none; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo-section">
                <img src="assets/logo.png" alt="Logo" class="main-logo">
                <div>
                    <h1>OM BEN BILLIARD</h1>
                    <p>X V3 KARAOKE Admin</p>
                </div>
            </div>
            <nav></nav>
        </header>

        <script src="assets/app.js"></script>
        <script>renderNavbar('admin');</script>

        <section>
            <div class="admin-header-flex" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
                <h2 style="font-family: var(--font-heading); margin: 0;">Manajemen Menu F&B</h2>
                <div style="display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap;">
                    <input type="text" id="search-admin-menu" placeholder="Cari menu..." oninput="loadMenu()" style="background: rgba(255,255,255,0.05); border-radius: 10px; padding: 0.6rem 1rem; color: white; border: 1px solid var(--glass-border); min-width: 150px;">
                    <button class="btn btn-primary" style="width: auto;" onclick="openMenuModal()">+ Tambah</button>
                </div>
            </div>
            
            <div style="background: var(--card-bg); border-radius: 20px; overflow-x: auto; border: 1px solid var(--glass-border);">
                <table class="admin-table-container" style="width: 100%; border-collapse: collapse; text-align: left;">
                    <thead>
                        <tr>
                            <th style="padding: 1rem; background: rgba(255,255,255,0.05); color: var(--text-dim);">Kategori</th>
                            <th style="padding: 1rem; background: rgba(255,255,255,0.05); color: var(--text-dim);">Nama Menu</th>
                            <th style="padding: 1rem; background: rgba(255,255,255,0.05); color: var(--text-dim);">Harga</th>
                            <th style="padding: 1rem; background: rgba(255,255,255,0.05); color: var(--text-dim); text-align: center;">Stok</th>
                            <th style="padding: 1rem; background: rgba(255,255,255,0.05); color: var(--text-dim); text-align: right;">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="menu-list">
                        <!-- Menu items will be injected here -->
                    </tbody>
                </table>
            </div>
        </section>
    </div>

    <!-- Add Menu Modal -->
    <div class="modal" id="menu-modal">
        <div class="modal-content">
            <h2 style="margin-bottom: 1.5rem; font-family: var(--font-heading);">Tambah Menu F&B</h2>
            <form id="menu-form">
                <div class="form-group">
                    <label>Kategori</label>
                    <input type="text" id="menu-category" list="category-options" required placeholder="Pilih atau ketik kategori baru">
                    <datalist id="category-options"></datalist>
                </div>
                <div class="form-group">
                    <label>Nama Makanan/Minuman</label>
                    <input type="text" id="menu-name" required placeholder="Contoh: Es Teh Manis">
                </div>
                <div class="form-group">
                    <label>Harga (Rp)</label>
                    <input type="number" id="menu-price" required placeholder="5000">
                </div>
                <div class="form-group">
                    <label>Stok Awal</label>
                    <input type="number" id="menu-stock" required placeholder="100" value="0">
                </div>
                <div style="display: flex; gap: 1rem; margin-top: 2rem;">
                    <button type="button" class="btn btn-outline" onclick="document.getElementById('menu-modal').style.display='none'">Batal</button>
                    <button type="submit" class="btn btn-primary">Simpan Menu</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        if (localStorage.getItem('auth_role') !== 'admin') {
            window.location.href = 'index.html';
        }

        async function loadMenu() {
            const menu = await fetchData('/menu');
            const categories = [...new Set(menu.map(item => item.category))];
            
            const datalist = document.getElementById('category-options');
            datalist.innerHTML = '';
            categories.forEach(c => {
                const opt = document.createElement('option');
                opt.value = c;
                datalist.appendChild(opt);
            });

            const searchQuery = document.getElementById('search-admin-menu').value.toLowerCase();
            const filtered = menu.filter(item => item.name.toLowerCase().includes(searchQuery));

            const tbody = document.getElementById('menu-list');
            tbody.innerHTML = '';
            
            if (filtered.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; padding:2rem; color: var(--text-dim);">Menu tidak ditemukan</td></tr>';
                return;
            }

            const grouped = filtered.reduce((acc, item) => {
                if (!acc[item.category]) acc[item.category] = [];
                acc[item.category].push(item);
                return acc;
            }, {});

            for (const category in grouped) {
                const headerRow = document.createElement('tr');
                headerRow.innerHTML = `
                    <td colspan="5" style="padding: 0.8rem 1rem; background: rgba(0, 243, 255, 0.05); font-weight: bold; color: var(--primary-color); font-size: 0.8rem;">
                        ${category.toUpperCase()}
                    </td>
                `;
                tbody.appendChild(headerRow);

                grouped[category].forEach(item => {
                    const row = document.createElement('tr');
                    row.style.borderBottom = '1px solid var(--glass-border)';
                    row.innerHTML = `
                        <td style="padding: 1rem; color: var(--text-dim);">${item.category}</td>
                        <td style="padding: 1rem; font-weight: 600;">${item.name}</td>
                        <td style="padding: 1rem; color: var(--accent-gold);">${formatRupiah(item.price)}</td>
                        <td style="padding: 1rem; text-align: center;">
                            <div style="display: flex; align-items: center; gap: 0.5rem; justify-content: center;">
                                <button class="btn btn-outline" style="width: 28px; height: 28px; padding: 0;" onclick="adjustStock(${item.id}, -1)">-</button>
                                <span style="min-width: 30px; font-weight: bold; color: ${item.stock <= 5 ? 'var(--danger)' : 'white'}">${item.stock || 0}</span>
                                <button class="btn btn-outline" style="width: 28px; height: 28px; padding: 0;" onclick="adjustStock(${item.id}, 1)">+</button>
                            </div>
                        </td>
                        <td style="padding: 1rem; text-align: right;">
                            <button class="btn btn-outline" style="padding: 0.4rem 0.8rem; font-size: 0.75rem; color: var(--danger); border-color: rgba(231, 76, 60, 0.2);" onclick="deleteMenu(${item.id})">Hapus</button>
                        </td>
                    `;
                    tbody.appendChild(row);
                });
            }
        }

        async function adjustStock(id, delta) {
            const res = await postData(`/menu/${id}/adjust-stock`, { 
                delta, 
                reason: 'Admin Adjustment',
                user: localStorage.getItem('auth_user') 
            });
            if (res) loadMenu();
        }

        function openMenuModal() {
            document.getElementById('menu-form').reset();
            document.getElementById('menu-modal').style.display = 'flex';
        }

        document.getElementById('menu-form').onsubmit = async (e) => {
            e.preventDefault();
            const res = await postData(`/menu?user=${localStorage.getItem('auth_user')}`, {
                category: document.getElementById('menu-category').value,
                name: document.getElementById('menu-name').value,
                price: parseInt(document.getElementById('menu-price').value),
                stock: parseInt(document.getElementById('menu-stock').value) || 0
            });
            if (res) {
                document.getElementById('menu-modal').style.display = 'none';
                loadMenu();
            }
        };

        async function deleteMenu(id) {
            if(confirm('Hapus menu ini?')) {
                const res = await deleteData(`/menu/${id}`);
                if (res && res.success) {
                    loadMenu();
                } else {
                    alert('Gagal menghapus menu. Silakan coba lagi.');
                }
            }
        }

        // Auto Refresh Admin Menu every 30s
        setInterval(loadMenu, 30000);
        loadMenu();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Elite Management | Admin Om Ben</title>
    <link rel="stylesheet" href="assets/style.css">
    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --neon-blue: #00f3ff;
            --neon-gold: #facd15;
            --deep-dark: #0a0a12;
        }

        body {
            background: radial-gradient(circle at top right, #1a1a2e, #0a0a12);
        }

        .stats-overview {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2.5rem;
        }

        .stat-card-premium {
            background: linear-gradient(135deg, rgba(255,255,255,0.05), rgba(255,255,255,0.01));
            border: 1px solid var(--glass-border);
            padding: 1.5rem;
            border-radius: 20px;
            position: relative;
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .stat-card-premium:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5), 0 0 15px rgba(0,243,255,0.1);
        }

        .stat-card-premium i {
            font-size: 2.5rem;
            opacity: 0.1;
            position: absolute;
            right: 1rem;
            bottom: 0.5rem;
        }

        .stat-card-premium .val {
            font-size: 2rem;
            font-weight: 800;
            margin: 0.5rem 0;
            background: linear-gradient(to right, #fff, var(--text-dim));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .stat-card-premium .label {
            color: var(--text-dim);
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .admin-grid-lux {
            display: grid;
            grid-template-columns: 380px 1fr;
            gap: 2rem;
        }

        @media (max-width: 1100px) {
            .admin-grid-lux { grid-template-columns: 1fr; }
        }

        .panel-lux {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 1.5rem;
            backdrop-filter: blur(10px);
        }

        .lux-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0 8px;
        }

        .lux-table th {
            padding: 1rem;
            text-align: left;
            color: var(--text-dim);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid var(--glass-border);
        }

        .lux-table tr td {
            padding: 1.2rem 1rem;
            background: rgba(255,255,255,0.01);
            transition: all 0.2s ease;
        }

        .lux-table tr:hover td {
            background: rgba(255,255,255,0.04);
            transform: scale(1.005);
        }

        .lux-table tr td:first-child { border-radius: 12px 0 0 12px; border-left: 1px solid var(--glass-border); }
        .lux-table tr td:last-child { border-radius: 0 12px 12px 0; border-right: 1px solid var(--glass-border); }
        .lux-table tr td { border-top: 1px solid var(--glass-border); border-bottom: 1px solid var(--glass-border); }

        .type-badge {
            font-size: 0.65rem;
            padding: 4px 10px;
            border-radius: 50px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .badge-in { background: rgba(0,243,255,0.1); color: var(--neon-blue); border: 1px solid rgba(0,243,255,0.2); }
        .badge-out { background: rgba(250,204,21,0.1); color: var(--neon-gold); border: 1px solid rgba(250,204,21,0.2); }

        .btn-lux {
            background: linear-gradient(135deg, var(--primary-color), #4facfe);
            color: white;
            border: none;
            padding: 0.8rem 1.5rem;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-lux:hover {
            filter: brightness(1.2);
            box-shadow: 0 0 20px rgba(0,243,255,0.3);
        }

        .scroll-container {
            max-height: 550px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .scroll-container::-webkit-scrollbar { width: 4px; }
        .scroll-container::-webkit-scrollbar-thumb { background: var(--glass-border); border-radius: 10px; }

        @media print {
            .no-print { display: none !important; }
            body { background: white !important; color: black !important; }
            .panel-lux { border: none !important; background: transparent !important; box-shadow: none !important; }
            .lux-table tr td { border: 1px solid #eee !important; background: transparent !important; color: black !important; }
            .lux-table th { color: black !important; border-bottom: 2px solid #000 !important; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="no-print">
            <div class="logo-section">
                <img src="assets/logo.png" alt="Logo" class="main-logo">
                <div>
                    <h1>OM BEN BILLIARD</h1>
                    <p>X V3 KARAOKE Staff Management</p>
                </div>
            </div>
            <nav></nav>
        </header>

        <script src="assets/app.js"></script>
        <script>renderNavbar('attendance-admin');</script>

        <div class="stats-overview no-print">
            <div class="stat-card-premium">
                <div class="label">Total Karyawan</div>
                <div class="val" id="stat-total-emp">0</div>
                <div style="font-size: 0.7rem; color: var(--text-dim);">Terdaftar aktif</div>
            </div>
            <div class="stat-card-premium">
                <div class="label">Hadir Hari Ini</div>
                <div class="val" id="stat-present-today" style="background: linear-gradient(to right, var(--neon-blue), #fff); -webkit-background-clip: text;">0</div>
                <div style="font-size: 0.7rem; color: var(--text-dim);">Shift aktif</div>
            </div>
            <div class="stat-card-premium">
                <div class="label">Sistem Status</div>
                <div class="val" style="font-size: 1.2rem; color: var(--success);">● ONLINE</div>
                <div style="font-size: 0.7rem; color: var(--text-dim);">Refresh: 1s</div>
            </div>
        </div>

        <div style="display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 2rem; flex-wrap: wrap; gap: 1rem;">
            <div>
                <h2 style="font-family: var(--font-heading); font-size: 2rem; margin: 0;">Elite Staff Panel</h2>
                <p style="color: var(--text-dim); margin-top: 5px;">Manajemen kehadiran & database karyawan</p>
            </div>
            <div style="display: flex; gap: 1rem;" class="no-print">
                <button class="btn btn-outline" style="width: auto; border-radius: 12px; color: var(--danger);" onclick="resetAttendance()">Reset Absensi</button>
                <button class="btn-lux" onclick="printStaffReport()">
                    <span>🖨️</span> Cetak Laporan
                </button>
            </div>
        </div>

        <div class="admin-grid-lux">
            <!-- Left Side: Directory -->
            <div class="panel-lux">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
                    <h3 style="margin: 0; font-size: 1rem; color: var(--neon-blue);">DIRECTORY</h3>
                    <button class="btn btn-primary no-print" style="width: auto; height: 35px; border-radius: 10px; font-size: 0.8rem;" onclick="openAddEmpModal()">+ NEW STAFF</button>
                </div>
                <div class="scroll-container">
                    <table class="lux-table">
                        <tbody id="employee-list"></tbody>
                    </table>
                </div>
            </div>

            <!-- Right Side: History -->
            <div class="panel-lux">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; flex-wrap: wrap; gap: 1rem;">
                    <h3 style="margin: 0; font-size: 1rem; color: var(--neon-gold);" id="attendance-title">ATTENDANCE LOGS</h3>
                    <div style="display: flex; gap: 0.5rem;" class="no-print">
                        <button class="btn btn-outline" style="width: auto; font-size: 0.7rem; padding: 5px 12px; border-radius: 8px;" onclick="setFilter('today')">HARI INI</button>
                        <button class="btn btn-outline" style="width: auto; font-size: 0.7rem; padding: 5px 12px; border-radius: 8px;" onclick="setFilter('week')">MINGGU INI</button>
                        <button class="btn btn-outline" style="width: auto; font-size: 0.7rem; padding: 5px 12px; border-radius: 8px;" onclick="setFilter('month')">BULAN INI</button>
                    </div>
                </div>
                <div class="scroll-container">
                    <table class="lux-table">
                        <thead>
                            <tr>
                                <th>WAKTU</th>
                                <th>NAMA KARYAWAN</th>
                                <th style="text-align: center;">STATUS</th>
                            </tr>
                        </thead>
                        <tbody id="attendance-history"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Premium -->
    <div class="modal" id="emp-modal">
        <div class="modal-content" style="background: var(--deep-dark); border: 1px solid var(--glass-border); border-radius: 30px; padding: 2.5rem;">
            <h2 style="margin-bottom: 2rem; font-family: var(--font-heading); color: var(--neon-blue);">Registrasi Staf Baru</h2>
            <form id="emp-form">
                <div class="form-group">
                    <label style="color: var(--text-dim); font-size: 0.8rem;">Nama Lengkap</label>
                    <input type="text" id="emp-name" required style="background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); border-radius: 12px; padding: 1rem; color: white;">
                </div>
                <div class="form-group">
                    <label style="color: var(--text-dim); font-size: 0.8rem;">Peran Strategis</label>
                    <input type="text" id="emp-role" list="role-options" required style="background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); border-radius: 12px; padding: 1rem; color: white;">
                    <datalist id="role-options">
                        <option value="Kasir Elite"><option value="Operator Senior"><option value="Floor Manager"><option value="Security"><option value="Lc Professional">
                    </datalist>
                </div>
                <div style="display: flex; gap: 1rem; margin-top: 3rem;">
                    <button type="button" class="btn btn-outline" onclick="document.getElementById('emp-modal').style.display='none'" style="border-radius: 12px; padding: 1rem;">BATAL</button>
                    <button type="submit" class="btn-lux" style="flex: 1; justify-content: center;">KONFIRMASI DATA</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let allEmployees = [];
        let allAttendance = [];
        let currentFilter = 'all';

        async function loadData() {
            allEmployees = await fetchData('/employees');
            allAttendance = await fetchData('/attendance');
            
            updateTopStats();
            renderEmployees();
            renderAttendance();
        }

        function updateTopStats() {
            const nowStr = getSyncedNow().toISOString().split('T')[0];
            const presentToday = new Set(allAttendance.filter(a => a.timestamp.startsWith(nowStr)).map(a => a.employeeName)).size;
            
            document.getElementById('stat-total-emp').textContent = allEmployees.length;
            document.getElementById('stat-present-today').textContent = presentToday;
        }

        function renderEmployees() {
            const list = document.getElementById('employee-list');
            list.innerHTML = '';
            allEmployees.forEach(emp => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>
                        <div style="font-weight: 700; color: #fff;">${emp.name}</div>
                        <div style="font-size: 0.7rem; color: var(--neon-blue); text-transform: uppercase;">${emp.role}</div>
                    </td>
                    <td style="text-align: right;">
                        <button class="btn btn-outline" style="width: auto; padding: 5px 10px; font-size: 0.65rem; border-radius: 8px; color: var(--danger); opacity: 0.6;" onclick="deleteEmployee('${emp.id}')">Hapus</button>
                    </td>
                `;
                list.appendChild(row);
            });
        }

        function setFilter(f) {
            currentFilter = f;
            renderAttendance();
        }

        function renderAttendance() {
            const list = document.getElementById('attendance-history');
            const title = document.getElementById('attendance-title');
            list.innerHTML = '';
            
            let filtered = [...allAttendance];
            const now = getSyncedNow();
            
            if (currentFilter === 'today') {
                const todayStr = now.toISOString().split('T')[0];
                filtered = allAttendance.filter(a => a.timestamp.startsWith(todayStr));
                title.textContent = "LOGS: HARI INI";
            } else if (currentFilter === 'week') {
                const weekAgo = new Date(now.getTime() - 7 * 24 * 60 * 60 * 1000);
                filtered = allAttendance.filter(a => new Date(a.timestamp) >= weekAgo);
                title.textContent = "LOGS: 7 HARI TERAKHIR";
            } else if (currentFilter === 'month') {
                const monthStr = now.toISOString().slice(0, 7);
                filtered = allAttendance.filter(a => a.timestamp.startsWith(monthStr));
                title.textContent = "LOGS: BULAN INI";
            } else {
                title.textContent = "ATTENDANCE LOGS";
            }

            filtered.sort((a,b) => new Date(b.timestamp) - new Date(a.timestamp)).forEach(a => {
                const date = new Date(a.timestamp);
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>
                        <div style="font-weight: 600;">${date.toLocaleDateString('id-ID')}</div>
                        <div style="font-size: 0.75rem; color: var(--text-dim);">${date.toLocaleTimeString('id-ID')}</div>
                    </td>
                    <td style="font-weight: 500;">${a.employeeName}</td>
                    <td style="text-align: center;">
                        <span class="type-badge ${a.type === 'in' ? 'badge-in' : 'badge-out'}">
                            ${a.type === 'in' ? 'Masuk' : 'Keluar'}
                        </span>
                    </td>
                `;
                list.appendChild(row);
            });
        }

        async function deleteEmployee(id) {
            if (confirm('Hapus data karyawan ini dari database?')) {
                const res = await deleteData(`/employees/${id}`);
                if (res && res.success) loadData();
            }
        }

        function openAddEmpModal() {
            document.getElementById('emp-form').reset();
            document.getElementById('emp-modal').style.display = 'flex';
        }

        document.getElementById('emp-form').onsubmit = async (e) => {
            e.preventDefault();
            const res = await postData('/employees', {
                name: document.getElementById('emp-name').value,
                role: document.getElementById('emp-role').value
            });
            if (res) {
                document.getElementById('emp-modal').style.display = 'none';
                loadData();
            }
        };

        async function resetAttendance() {
            if (confirm('PERINGATAN: Hapus seluruh data absensi hari ini?')) {
                const res = await postData('/attendance/close-shift', {});
                if (res) loadData();
            }
        }

        function printStaffReport() {
            const table = document.querySelector('#attendance-history').closest('table').cloneNode(true);
            const printWin = window.open('', '_blank');
            const html = `
                <html>
                <head>
                    <title>Rekap Absensi Elite</title>
                    <style>
                        body { font-family: sans-serif; padding: 40px; color: #000; background: #fff; }
                        h1, h2 { text-align: center; margin-bottom: 10px; }
                        table { width: 100%; border-collapse: collapse; margin-top: 30px; }
                        th, td { border: 1px solid #000; padding: 12px; text-align: left; }
                        th { background: #f0f0f0; font-weight: bold; }
                        .type-badge { font-weight: bold; }
                    </style>
                </head>
                <body>
                    <h1 style="border-bottom: 2px solid #000; padding-bottom: 10px;">OM BEN BILLIARD X V3 KARAOKE</h1>
                    <h2>LAPORAN REKAPITULASI ABSENSI STAF</h2>
                    <p style="text-align: center;">Periode: ${document.getElementById('attendance-title').textContent}</p>
                    <p style="text-align: right;">Dicetak: ${new Date().toLocaleString('id-ID')}</p>
                    ${table.outerHTML}
                    <div style="margin-top: 50px; display: flex; justify-content: flex-end;">
                        <div style="text-align: center; width: 200px;">
                            <p>Admin Operational</p>
                            <br><br><br>
                            <p>( ________________ )</p>
                        </div>
                    </div>
                    <script>
                        window.onload = function() { window.print(); setTimeout(() => window.close(), 500); }
                    <\/script>
                </body>
                </html>`;
            printWin.document.write(html);
            printWin.document.close();
        }

        setInterval(loadData, 1000); // REFRESH TIAP DETIK SESUAI PERMINTAAN
        loadData();
    </script>
</body>
</html>

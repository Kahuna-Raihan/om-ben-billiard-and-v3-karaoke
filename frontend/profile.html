<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil Saya | Om Ben Billiard</title>
    <link rel="stylesheet" href="assets/style.css">
    <style>
        .profile-container {
            max-width: 500px;
            margin: 0 auto;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            padding: 3rem;
            border-radius: 28px;
        }
        .profile-header {
            text-align: center;
            margin-bottom: 2.5rem;
        }
        .profile-header h2 {
            font-family: var(--font-heading);
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }
        .profile-header p {
            color: var(--text-dim);
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo-section">
                <img src="assets/logo.png" alt="Logo" class="main-logo">
                <div>
                    <h1>OM BEN BILLIARD</h1>
                    <p>X V3 KARAOKE User Profile</p>
                </div>
            </div>
            <nav></nav>
        </header>

        <script src="assets/app.js"></script>
        <script>renderNavbar('profile');</script>

        <div class="profile-container">
            <div class="profile-header">
                <h2>Pengaturan Profil</h2>
                <p>Kelola username dan password akun Anda</p>
            </div>

            <form id="profile-form">
                <div class="form-group">
                    <label>Username Baru</label>
                    <input type="text" id="new-username" placeholder="Masukkan username baru" required>
                </div>
                <div class="form-group">
                    <label>Password Baru</label>
                    <input type="password" id="new-password" placeholder="Masukkan password baru (opsional)">
                </div>
                <div class="form-group" style="margin-top: 2rem;">
                    <button type="submit" class="btn btn-primary" id="save-btn">Simpan Perubahan</button>
                </div>
                <div id="status-message" style="text-align: center; margin-top: 1rem; font-size: 0.9rem;"></div>
            </form>
        </div>
    </div>

    <script>
        const oldUser = localStorage.getItem('auth_user');
        document.getElementById('new-username').value = oldUser;

        document.getElementById('profile-form').onsubmit = async (e) => {
            e.preventDefault();
            const saveBtn = document.getElementById('save-btn');
            const statusEl = document.getElementById('status-message');
            
            const newUsername = document.getElementById('new-username').value;
            const newPassword = document.getElementById('new-password').value;

            saveBtn.disabled = true;
            saveBtn.textContent = 'Menyimpan...';
            
            try {
                const res = await putData('/users/update', {
                    oldUsername: oldUser,
                    newUsername: newUsername,
                    newPassword: newPassword
                });
                
                if (res && res.success) {
                    statusEl.style.color = 'var(--primary-color)';
                    statusEl.textContent = 'Berhasil! Profil diperbarui. Mengalihkan...';
                    
                    // Update localStorage
                    localStorage.setItem('auth_user', newUsername);
                    
                    setTimeout(() => {
                        window.location.reload();
                    }, 1500);
                } else {
                    statusEl.style.color = 'var(--danger)';
                    statusEl.textContent = res.message;
                    saveBtn.disabled = false;
                    saveBtn.textContent = 'Simpan Perubahan';
                }
            } catch (err) {
                statusEl.style.color = 'var(--danger)';
                statusEl.textContent = 'Gagal terhubung ke server.';
                saveBtn.disabled = false;
                saveBtn.textContent = 'Simpan Perubahan';
            }
        };
    </script>
</body>
</html>
